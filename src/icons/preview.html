<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>NexusBrief Icons</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0E0E14;
      font-family: 'Segoe UI', sans-serif;
      color: #F1F5F9;
      padding: 40px;
    }
    h1 { font-size: 22px; margin-bottom: 8px; color: #FF9F43; }
    p  { font-size: 13px; color: #6B7088; margin-bottom: 36px; }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #6B7088;
      margin: 32px 0 14px;
      text-transform: uppercase;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }
    .card {
      background: #171821;
      border: 1px solid #2A2D3F;
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-width: 100px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: #FF9F43; }
    .card img   { width: 32px; height: 32px; }
    .card span  {
      font-size: 11px;
      color: #A0A4B8;
      text-align: center;
    }
    .sizes {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .sizes img { display: block; }
  </style>
</head>
<body>

  <h1>NexusBrief Icon Set</h1>
  <p>Warm Bright Bold — Clean Minimal — 24×24 SVG</p>

  <div class="section-title">Navigation</div>
  <div class="grid">
    <div class="card">
      <img src="home.svg" alt="home"/>
      <span>home</span>
    </div>
    <div class="card">
      <img src="history.svg" alt="history"/>
      <span>history</span>
    </div>
    <div class="card">
      <img src="settings.svg" alt="settings"/>
      <span>settings</span>
    </div>
    <div class="card">
      <img src="profile.svg" alt="profile"/>
      <span>profile</span>
    </div>
    <div class="card">
      <img src="admin.svg" alt="admin"/>
      <span>admin</span>
    </div>
    <div class="card">
      <img src="logout.svg" alt="logout"/>
      <span>logout</span>
    </div>
  </div>

  <div class="section-title">Actions</div>
  <div class="grid">
    <div class="card">
      <img src="generate.svg" alt="generate"/>
      <span>generate</span>
    </div>
    <div class="card">
      <img src="calendar.svg" alt="calendar"/>
      <span>calendar</span>
    </div>
    <div class="card">
      <img src="thumbs_up.svg" alt="thumbs up"/>
      <span>thumbs up</span>
    </div>
    <div class="card">
      <img src="thumbs_down.svg" alt="thumbs down"/>
      <span>thumbs down</span>
    </div>
    <div class="card">
      <img src="login.svg" alt="login"/>
      <span>login</span>
    </div>
    <div class="card">
      <img src="news.svg" alt="news"/>
      <span>news</span>
    </div>
  </div>

  <div class="section-title">Size Preview</div>
  <div class="grid">
    <div class="card">
      <div class="sizes">
        <img src="home.svg" style="width:16px;height:16px;" title="16px"/>
        <img src="home.svg" style="width:24px;height:24px;" title="24px"/>
        <img src="home.svg" style="width:32px;height:32px;" title="32px"/>
        <img src="home.svg" style="width:48px;height:48px;" title="48px"/>
      </div>
      <span>16 / 24 / 32 / 48 px</span>
    </div>
  </div>

</body>
</html>
